name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate tag, version, and release notes source
        shell: bash
        id: notes
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_type="$(git cat-file -t "${tag_ref}")"

          if [[ "${tag_type}" != "tag" ]]; then
            echo "Release tags must be annotated tags with a release message." >&2
            exit 1
          fi

          mkdir -p dist
          git cat-file tag "${tag_ref}" | sed '1,/^$/d' > dist/release-notes.md

          if [[ ! -s dist/release-notes.md ]]; then
            echo "Annotated tag message is empty." >&2
            exit 1
          fi

          echo "body_path=dist/release-notes.md" >> "${GITHUB_OUTPUT}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
