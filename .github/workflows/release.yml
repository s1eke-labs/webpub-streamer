name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate tag, version, and release notes source
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format vX.Y.Z"
            exit 1
          fi

          tag_type="$(git cat-file -t "refs/tags/${tag_name}")"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "Release tags must be annotated tags with a non-empty tag message"
            exit 1
          fi

          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "${tag_name#v}" != "${package_version}" ]]; then
            echo "Tag version ${tag_name#v} does not match package.json version ${package_version}"
            exit 1
          fi

          git for-each-ref --format='%(contents)' "refs/tags/${tag_name}" > tag-message.txt
          if [[ ! -s tag-message.txt ]] || [[ -z "$(tr -d '[:space:]' < tag-message.txt)" ]]; then
            echo "Annotated tag message must not be empty"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: tag-message.txt
